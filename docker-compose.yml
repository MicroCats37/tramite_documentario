services:
  redis:
    image: redis:7-alpine
    container_name: tramite_documentario_redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: tramite_documentario_db
    environment:
      # PostgreSQL usa POSTGRES_* internamente; mapeamos desde DB_* del .env
      POSTGRES_DB: ${DB_NAME:-tramite_documentario_db}
      POSTGRES_USER: ${DB_USER:-tramite_documentario_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tramite_documentario_user} -d ${DB_NAME:-tramite_documentario_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  scraper:
    build:
      context: worker/scraper
      dockerfile: Dockerfile
    container_name: tramite_documentario_scraper
    environment:
      PYTHONUNBUFFERED: "1"
      SCRAPER_INTERNAL_PORT: ${SCRAPER_INTERNAL_PORT:-8001}
    expose:
      - "${SCRAPER_INTERNAL_PORT:-8001}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${SCRAPER_INTERNAL_PORT:-8001}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tramite_documentario_backend
    env_file:
      - .env
    environment:
      # Django settings module — production por defecto, overridear en .env si es necesario
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8000}
      MEDIA_URL: ${MEDIA_URL:-http://backend:8000/media/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper:
        condition: service_healthy
    expose:
      - "${BACKEND_INTERNAL_PORT:-8000}"
    volumes:
      - backend_static:/app/staticfiles
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
        NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-tramite_documentario_auth}
        BACKEND_HOST: backend:${BACKEND_INTERNAL_PORT:-8000}
    container_name: tramite_documentario_frontend
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
      NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-tramite_documentario_auth}
      BACKEND_HOST: backend:${BACKEND_INTERNAL_PORT:-8000}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: tramite_documentario_proxy
    depends_on:
      - frontend
      - backend
    ports:
      # Único puerto público vía proxy (configurable vía PROXY_PORT).
      # Nginx enruta /backend/* → backend/api/* y /api/auth/* → frontend.
      - "${PROXY_PORT:-7100}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
